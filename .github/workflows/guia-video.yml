name: guia-video
on:
  push:
    branches: [guia-video]
    paths: ['guia/_partes.txt', 'guia/_roteiro.json', '.github/gerar_videos.py', '.github/workflows/guia-video.yml']
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install edge-tts
      - run: python .github/gerar_videos.py $(cat guia/_partes.txt 2>/dev/null)
      - run: |
          git config user.name "nexum-bot"; git config user.email "bot@users.noreply.github.com"
          git add guia/video && git commit -m "Vídeos narrados da Central de treinamento" && git pull --rebase -q && git push
