<style>
:root{--ink:#0A1733;--ink2:#13244D;--ink3:#22386B;--gold:#C9A227;--gold2:#F3D98B;--bg:#F3F5FA;--card:#fff;--line:#E3E7F0;--line2:#EEF1F7;--txt:#0F1B33;--mut:#5B6478;

input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-height:40px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--bg)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}

svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.lg-a{padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(1200px 600px at 10% 10%,#1B3F8C 0%,transparent 60%),linear-gradient(160deg,#0A1733,#0D1F47)}
.lg-a h1{font-size:40px;line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}.lg-a h1 b{color:var(--gold2)}.lg-a p{color:#C9D4EE;max-width:460px;font-size:16px}
.lg-f{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px}.lg-f div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;font-size:13px;color:#DCE4F7;display:flex;gap:10px;align-items:center}
.lg-b{background:#fff;display:flex;align-items:center;justify-content:center;padding:32px}.lg-c{width:min(380px,100%)}.lg-c h2{font-size:24px;margin:0 0 6px}.lg-c label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}

/* app */

.nav{background:var(--ink);color:#C9D4EE;display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}

.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}.nav .cnt{margin-left:auto;background:var(--gold);color:var(--ink);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:800}

.wa-st{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;flex:none}
.main{min-width:0;display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff}.top h1{font-size:18px;margin:0}.top .sp{flex:1}
.body{flex:1;min-height:0;overflow:auto;padding:18px 20px}

.ibx>div{min-height:0;display:flex;flex-direction:column}
.lst{border-right:1px solid var(--line);background:#fff}.lst-h{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:3px;background:#EEF1F7;border-radius:10px;padding:3px;overflow:auto}.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:700;color:#4B556B;white-space:nowrap}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(10,23,51,.12)}
.itens{overflow:auto;flex:1}.it{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}.it:hover{background:#F8FAFD}.it.on{background:var(--pri-s)}.it.nl:after{content:'';position:absolute;right:12px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--pri)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;position:relative}.av .cn{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:800}
.it .t{flex:1;min-width:0}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.it .t span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .q{font-size:11.5px;color:var(--mut);white-space:nowrap}
.chat{background:#F7F8FC}.ch-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}.ch-h .t{flex:1;min-width:0}.ch-h .t b{font-size:15px}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:72%;padding:9px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word;line-height:1.45}.bb small{display:block;font-size:11px;color:var(--mut);margin-top:4px}
.bb.nos{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}.bb.nos small{color:#AEBBDA}.bb.bot{align-self:flex-start;background:#F1ECFF;border-color:#E2D8FF}.bb.nota{align-self:center;background:#FFF8E1;border-color:#F3E3A6;font-size:13px;max-width:86%}.bb.sis{align-self:center;background:transparent;border:0;color:var(--mut);font-size:12px}
.bb a{color:inherit;text-decoration:underline}
.cp{background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}.cp-r{display:flex;gap:8px;align-items:flex-end}.cp textarea{min-height:44px;max-height:160px;resize:none}
.cp .tools{display:flex;gap:6px;flex-wrap:wrap}
.semsel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);gap:8px;text-align:center;padding:30px}.semsel .ic{width:64px;height:64px;border-radius:18px;background:var(--pri-s);color:var(--pri);display:grid;place-items:center}
.fc{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px}.fc h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600;text-align:right}
.cartao{background:linear-gradient(135deg,#0A1733,#1B3F8C);color:#fff;border-radius:16px;padding:16px;position:relative;overflow:hidden}.cartao:after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(201,162,39,.18)}
.cartao .tag{font-family:ui-monospace,monospace;font-size:20px;letter-spacing:.14em;color:var(--gold2);font-weight:700}.cartao small{color:#AEBBDA}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}.kpi small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}.kpi b{display:block;font-size:26px;margin-top:4px}.kpi span{font-size:12.5px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse}table.t th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);background:#F8FAFD;padding:10px 12px;border-bottom:1px solid var(--line)}table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;height:100%;min-height:0}.kb-c{background:#EEF1F7;border-radius:14px;display:flex;flex-direction:column;min-height:0}.kb-c h4{margin:0;padding:12px 14px;font-size:13px;display:flex;gap:8px;align-items:center}.kb-c .l{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.kb-i{background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line);cursor:pointer}.kb-i:hover{border-color:var(--pri)}
.ov{position:fixed;inset:0;background:rgba(10,23,51,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.md{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(10,23,51,.3)}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.md-h h3{margin:0;font-size:17px}.md-b{padding:18px;overflow:auto}.md-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90}#toast div{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);font-weight:600}#toast div.e{background:var(--bad)}
.rlist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}.rlist button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.rlist button:hover{border-color:var(--pri);background:var(--pri-s)}
.vazio{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:1200px){.ibx{grid-template-columns:300px minmax(0,1fr)}.fc{display:none}.ibx.ficha .fc{display:block;position:fixed;right:0;top:0;bottom:0;width:340px;z-index:30;box-shadow:-10px 0 40px rgba(10,23,51,.2)}}
@media(max-width:760px){.app{grid-template-columns:1fr}.nav{display:none}.ibx{grid-template-columns:1fr}.ibx .chat{display:none}.ibx.sel .lst{display:none}.ibx.sel .chat{display:flex}}
</style>

async function acharCliente({ token, cpf, tel, vendaId, imei, tag, numero }) {

    if (numero && !cpf) { const l = await DB.list('vendas', [['numero', '==', +numero]]); if (l[0]) cpf = l[0].clienteCpf; vs = l; }
    if (imei && !cpf) { const l = await DB.list('aparelhos', [['imei', '==', imei]]); if (l[0]?.vendaId) { const v = await DB.get('vendas', l[0].vendaId); if (v) { cpf = v.clienteCpf; vs = [v]; } } }
    if (tel && !cpf) { const t = soD(tel).replace(/^55(?=\d{10,11}$)/, ''); const l = await DB.list('clientes', [['telefones', 'array-contains', t]]); if (l[0]) cpf = l[0].id; }
    if (cpf) vs = await DB.list('vendas', [['clienteCpf', '==', soD(cpf)]]);
  } catch (e) { console.warn('acharCliente', e.code || e.message); }
  vs = vs.filter(v => !['REPROVADA'].includes(v.status)).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  const aps = {}; for (const v of vs.slice(0, 4)) if (v.aparelhoToken) aps[v.id] = await DB.get('aparelhos', v.aparelhoToken).catch(() => null);
  return { cpf, vs, aps };
}

}
function novaConversa() {
  const m = modal('Nova conversa no WhatsApp', `<label class="small" style="font-weight:600;color:var(--mut)">WhatsApp (com DDD)</label><input id="ncT" inputmode="tel" placeholder="(45) 99999-0000"><label class="small" style="font-weight:600;color:var(--mut);display:block;margin-top:10px">Nome</label><input id="ncN"><label class="small" style="font-weight:600;color:var(--mut);display:block;margin-top:10px">Fila</label><select id="ncF">${filasMinhas().map(k => `<option value="${k}">${FILAS[k][0]}</option>`).join('')}</select><label class="small" style="font-weight:600;color:var(--mut);display:block;margin-top:10px">Mensagem</label><textarea id="ncM" rows="3">Olá! Aqui é ${esc(C.me.nome.split(' ')[0])}, da NexumCell.</textarea>`, '<button class="btn" data-x3>Cancelar</button><button class="btn pri" id="ncOk">Enviar</button>');
  $('[data-x3]', m).onclick = fechar;
  $('#ncOk').onclick = async () => { const n = soD($('#ncT').value); if (n.length < 10) return toast('WhatsApp com DDD', true); const n55 = n.startsWith('55') ? n : '55' + n;
    await DB.set('waConversas', n55, { numero: n55, nome: $('#ncN').value.trim() || fmtTel(n), fila: $('#ncF').value, atualizadoEm: Date.now(), criadoEm: Date.now(), iniciadaPor: C.me.nome });
    fechar(); const it = { canal: 'wa', id: n55, nome: $('#ncN')?.value || fmtTel(n), tel: n55, fila: $('#ncF')?.value || 'suporte', raw: {}, key: 'wa:' + n55 }; await enviar(it, ($('#ncM')?.value || '').trim() || 'Olá! Aqui é da NexumCell.'); abrir('wa:' + n55); };
}

/* ---------- equipe e configuração ---------- */
function vEquipe(el) {
  el.innerHTML = `<div class="card"><h2 style="margin:0 0 6px">Equipe e filas</h2><p class="muted" style="margin:0 0 14px">Os atendimentos de cada fila são divididos por igual entre as pessoas ativas dela (quem tem menos atendimentos abertos recebe o próximo). Para criar uma pessoa nova (comercial, suporte ou financeiro), use o Painel do Dono → Equipe NexumCell.</p>
    <table class="t"><thead><tr><th>Pessoa</th><th>Perfil</th><th>Fila no CRM</th><th>Abertos</th><th>Recebe atendimentos</th></tr></thead><tbody>${C.equipe.map(u => `<tr><td><b>${esc(u.nome)}</b><div class="small muted">${esc(u.codigo || u.email || '')}</div></td><td>${esc(u.role)}</td>
      <td><select data-fila="${u.id}" style="width:auto">${Object.entries(FILAS).map(([k, v]) => `<option value="${k}" ${u.fila === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></td><td>${C.itens.filter(i => i.etapa !== 'fim' && i.resp?.uid === u.id).length}</td>
      <td><input type="checkbox" data-at="${u.id}" style="width:auto;min-height:0" ${u.crmAtivo === false || u.ativo === false ? '' : 'checked'}></td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Ninguém na equipe ainda</td></tr>'}</tbody></table></div>`;
  $$('[data-fila]', el).forEach(s => s.onchange = () => DB.set('users', s.dataset.fila, { crmFila: s.value }).then(() => toast('Fila salva')).catch(e => toast(e.code || e.message, true)));
  $$('[data-at]', el).forEach(c => c.onchange = () => DB.set('users', c.dataset.at, { crmAtivo: c.checked }).then(() => toast('Salvo')).catch(e => toast(e.code || e.message, true)));
}
function vConfig(el) {
  const r = resp(), l = links();
  el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px">
    <div class="card"><h2 style="margin:0 0 6px">Respostas rápidas</h2><p class="muted small" style="margin:0 0 10px">Uma por linha: <b>Grupo | Título | Texto</b>. Use {nome}, {atendente}, {protocolo}, {portalCliente}, {linkContrato}, {linkPre}, {linkSite}.</p>
      <textarea id="cfR" rows="14" ${dono() ? '' : 'readonly'}>${esc(r.flatMap(([g, x]) => x.map(([t, m]) => `${g} | ${t} | ${m.replace(/\n/g, '\\n')}`)).join('\n'))}</textarea></div>
    <div class="card"><h2 style="margin:0 0 6px">Links de resolução</h2><p class="muted small" style="margin:0 0 10px">Uma por linha: <b>Título | link</b>.</p><textarea id="cfL" rows="6" ${dono() ? '' : 'readonly'}>${esc(l.map(([t, u]) => `${t} | ${u}`).join('\n'))}</textarea>
      <h2 style="margin:16px 0 6px">Mensagem automática</h2><p class="muted small" style="margin:0 0 10px">Vai sozinha quando a assistente passa o atendimento para a equipe.</p><textarea id="cfA" rows="4" ${dono() ? '' : 'readonly'}>${esc(C.cfg.msgAck || MSG_ACK)}</textarea></div></div>
    ${dono() ? '<div style="margin-top:14px;text-align:right"><button class="btn pri" id="cfOk">Salvar</button></div>' : ''}`;
  if ($('#cfOk')) $('#cfOk').onclick = async () => {
    const g = {}; $('#cfR').value.split('\n').map(x => x.split('|').map(s => s.trim())).filter(x => x.length >= 3 && x[2]).forEach(([gr, t, ...m]) => (g[gr] = g[gr] || []).push([t, m.join(' | ').replace(/\\n/g, '\n')]));
    const lk = $('#cfL').value.split('\n').map(x => x.split('|').map(s => s.trim())).filter(x => x.length >= 2 && x[1]).map(([t, ...u]) => [t, u.join('|')]);
    await DB.set('config', 'crm', { respostas: Object.entries(g), links: lk, msgAck: $('#cfA').value.trim() || MSG_ACK, atualizadoEm: Date.now() }); toast('Configuração salva'); };
}

/* ---------- início ---------- */
(async () => {
  if (!CFG.apiKey) { $('#root').innerHTML = '<div class="vazio">Configuração do Firebase não encontrada (nexumcell-config.js).</div>'; return; }
  try { await fbInit(); } catch (e) { $('#root').innerHTML = '<div class="vazio">Sem conexão com o servidor. Confira a internet e recarregue.</div>'; return; }
  F.au.onAuthStateChanged(F.auth, u => { if (u) entrou(u).catch(e => telaLogin('Erro ao entrar: ' + (e.code || e.message))); else { C.me = null; telaLogin(); } });
  setInterval(() => { if (C.me) { desenharNav(); } }, 60e3);
})();
</script>
</body>
