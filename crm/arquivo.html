<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo · NexumCell</title>
<script src="../nexumcell-config.js"></script>
<style>body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#F3F5FA;color:#0F1B33;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;background:#0A1733;color:#fff;padding:14px 18px;font-weight:800;letter-spacing:.06em}header b{color:#F3D98B}
main{width:min(900px,100%);padding:18px}.c{background:#fff;border:1px solid #E3E7F0;border-radius:14px;padding:16px;text-align:center}img,iframe{max-width:100%;border-radius:10px}iframe{width:100%;height:75vh;border:0}
a.b{display:inline-block;margin-top:14px;background:#1D5BFF;color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:700}</style></head>
<body><header>NEXUMCELL <b>· arquivo</b></header><main><div class="c" id="c">Carregando…</div></main>
<script>
(async()=>{ const id=new URLSearchParams(location.search).get('id'), c=document.getElementById('c'), cfg=window.NEXUMCELL_FIREBASE||{};
  if(!id) return c.textContent='Link inválido.';
  try{ const r=await fetch(`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/crmArquivos/${encodeURIComponent(id)}?key=${cfg.apiKey}`);
    if(!r.ok) throw 0; const f=(await r.json()).fields||{}, nome=f.nome?.stringValue||'arquivo', tipo=f.tipo?.stringValue||'', data=f.data?.stringValue||'';
    document.title=nome+' · NexumCell';
    c.innerHTML=(tipo.startsWith('image/')?`<img src="${data}" alt="">`:tipo==='application/pdf'?`<iframe src="${data}"></iframe>`:'')+`<div><a class="b" download="${nome.replace(/"/g,'')}" href="${data}">Baixar ${nome.replace(/</g,'')}</a></div>`;
  }catch(e){ c.textContent='Arquivo não encontrado ou expirado.'; } })();
</script></body></html>
